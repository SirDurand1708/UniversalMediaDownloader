plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.omnivault.media'
    compileSdk 34

    defaultConfig {
        applicationId "com.omnivault.media"
        minSdk 26
        targetSdk 34
        versionCode 203
        versionName "2.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    // Firma del APK de Release: usa debug.keystore para distribución directa (sideload).
    // En CI: KEYSTORE_PATH se establece como env var apuntando al keystore generado.
    // En local: si no existe la var, usa el debug.keystore estándar del SDK de Android.
    // Para Google Play: reemplaza por tu keystore de producción real.
    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH") ?:
                "${System.getProperty('user.home')}/.android/debug.keystore"
            storeFile file(ksPath)
            storePassword (System.getenv("KEYSTORE_PASSWORD") ?: "android")
            keyAlias (System.getenv("KEY_ALIAS") ?: "androiddebugkey")
            keyPassword (System.getenv("KEY_PASSWORD") ?: "android")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Redes y Corrutinas
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // JSON y Almacenamiento
    implementation 'com.google.code.gson:gson:2.10.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
