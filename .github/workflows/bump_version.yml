name: 🔖 OmniVault Version Bump & Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipo de incremento de versión'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-and-release:
    name: Bump Version & Push Tag
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔖 Incrementar versión (${{ inputs.bump_type }})
        id: bump
        run: |
          python bump_version.py --${{ inputs.bump_type }}
          NEW_VERSION=$(python -c "import json; print(json.load(open('version.json'))['version'])")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: 📝 Commit de bump de versión
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json \
                  android/app/build.gradle \
                  "android/app/src/main/java/com/omnivault/media/utils/UpdateManager.kt" \
                  updater.py
          git commit -m "chore: bump version to ${{ steps.bump.outputs.tag }}"

      - name: 🏷️ Crear tag de versión
        run: |
          git tag ${{ steps.bump.outputs.tag }}

      - name: 🚀 Push commit y tag al repositorio
        run: |
          git push origin main
          git push origin ${{ steps.bump.outputs.tag }}

      - name: ✅ Resumen
        run: |
          echo "✅ Versión bumpeada a ${{ steps.bump.outputs.tag }}"
          echo "🔄 El workflow de Release se disparará automáticamente para compilar y publicar la release."
