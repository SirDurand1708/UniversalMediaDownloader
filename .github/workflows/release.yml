name: ✦ OmniVault Official Multiplatform Release CI/CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre de la versión / Etiqueta (ej. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. Compilación de Distribuciones Windows (Instalador + Versión Portátil)
  # =========================================================================
  build-windows:
    name: Build Windows (Portable + Installer)
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Inno Setup Compiler
        run: |
          choco install innosetup --no-progress --no-color

      - name: 📚 Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Ejecutar suite de pruebas unitarias
        run: |
          python run_tests.py

      - name: ⚙️ Compilar a ejecutable autónomo (PyInstaller)
        run: |
          python build_exe.py

      - name: 📦 Generar paquetes portátiles e instalador
        run: |
          python package_release.py

      - name: 📤 Subir artefactos de Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/Releases/OmniVault-*-Windows-x64-Setup.exe
            dist/Releases/OmniVault-*-Windows-x64-Portable.zip

  # =========================================================================
  # 2. Compilación de Distribución Android (APK Oficial)
  # =========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🐘 Compilar APK de OmniVault con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../dist/Releases
          TAG_VAL="${{ github.ref_name || inputs.tag_name || 'v2.0.1' }}"
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../dist/Releases/OmniVault-${TAG_VAL}-Android.apk \;

      - name: 📤 Subir artefacto de Android
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/Releases/OmniVault-*-Android.apk

  # =========================================================================
  # 3. Publicación Oficial en GitHub Releases
  # =========================================================================
  publish-release:
    name: Publish Official Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 📥 Descargar binarios de Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist/Releases

      - name: 📥 Descargar APK de Android
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/Releases

      - name: 🛡️ Calcular Sumas de Verificación SHA-256
        run: |
          cd dist/Releases
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 🚀 Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v2.0.1' }}
          name: "✦ OmniVault ${{ github.ref_name || inputs.tag_name || 'v2.0.1' }} — Windows PC & Android"
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            dist/Releases/OmniVault-*-Windows-x64-Setup.exe
            dist/Releases/OmniVault-*-Windows-x64-Portable.zip
            dist/Releases/OmniVault-*-Android.apk
            dist/Releases/SHA256SUMS.txt
          body: |
            ## ✦ OmniVault ${{ github.ref_name || inputs.tag_name }} — Obsidian & Titanium Release

            > **Bóveda Multimedia Universal • Suite Creativa Multiplataforma para PC y Teléfonos Android**

            ---

            ### 📱 Nueva Versión para Teléfonos Android (Estilo Snaptube)
            - **⚡ Integración Directa con Menú Compartir:** Abre YouTube, TikTok, Facebook, Instagram o Twitter, presiona *Compartir* y selecciona **OmniVault** para descargar audio o video en 1 clic.
            - **📋 Auto-Detección de Portapapeles (Snaptube-like):** Al copiar un enlace en cualquier navegador o aplicación, OmniVault te muestra un aviso flotante interactivo con botones de descarga directa (*MP3 320k* y *MP4 FHD*).
            - **📥 Descarga en Segundo Plano:** Servicio persistente con barra de progreso, velocidad en MB/s y registro directo en la Galería y reproductores de Android.

            ---

            ### 💻 Versiones Disponibles para PC (Windows)
            - **📦 Versión Portátil:** Totalmente autónoma en formato `.zip`. Solo descomprime y ejecuta `OmniVault.exe` en cualquier PC o memoria USB sin instalar nada.
            - **🛠️ Instalador Oficial:** Instalador clásico `.exe` generado con Inno Setup, con accesos directos en el Escritorio y Menú Inicio.
            - **⚡ Aceleración Aria2c:** Soporte multihilo de hasta 8 conexiones simultáneas.
            - **✂️ Recorte de Medios (Trim):** Extrae fragmentos exactos de video y audio con precisión de fotograma.
            - **🔊 Normalización EBU R128:** Calibración a -16 LUFS estándar de streaming musical.

            ---

            ### 📦 Paquetes Oficiales de Descarga

            | Plataforma | Paquete | Archivo | Descripción |
            | :--- | :--- | :--- | :--- |
            | 📱 **Android** | **APK Instalable** | `OmniVault-v2.0.0-Android.apk` | Compatible con Android 8.0 a 14+. Descarga estilo Snaptube con menú compartir. |
            | 💻 **Windows** | **Instalador Setup** | `OmniVault-v2.0.0-Windows-x64-Setup.exe` | Instalación guiada clásica para Windows 10 y 11 (64 bits). |
            | 💻 **Windows** | **Versión Portátil** | `OmniVault-v2.0.0-Windows-x64-Portable.zip` | No requiere instalación. Extraer y ejecutar. Ideal para memorias USB. |
            | 🛡️ **Seguridad** | **Sumas de Integridad** | `SHA256SUMS.txt` | Hashes criptográficos SHA-256 para validar la autenticidad de los archivos. |
