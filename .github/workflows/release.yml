name: ✦ OmniVault Official Multiplatform Release CI/CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre de la versión / Etiqueta (ej. v2.0.8)'
        required: false
        default: 'v2.0.8'

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. Compilación de Distribuciones Windows (Instalador + Versión Portátil)
  # =========================================================================
  build-windows:
    name: Build Windows (Portable + Installer)
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Inno Setup Compiler y Binarios Portables (FFmpeg + Aria2c)
        run: |
          choco install innosetup ffmpeg aria2 --no-progress --no-color
          mkdir -Force bin
          if (Test-Path "C:\ProgramData\chocolatey\bin\ffmpeg.exe") { copy C:\ProgramData\chocolatey\bin\ffmpeg.exe bin\ }
          if (Test-Path "C:\ProgramData\chocolatey\bin\aria2c.exe") { copy C:\ProgramData\chocolatey\bin\aria2c.exe bin\ }

      - name: 📚 Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Ejecutar suite de pruebas unitarias
        run: |
          python run_tests.py

      - name: ⚙️ Compilar a ejecutable autónomo (PyInstaller)
        run: |
          python build_exe.py

      - name: 📦 Generar paquetes portátiles e instalador
        run: |
          python package_release.py --version "${{ github.ref_name }}"

      - name: 📤 Subir artefactos de Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/Releases/OmniVault-*-Windows-x64-Setup.exe
            dist/Releases/OmniVault-*-Windows-x64-Portable.zip

  # =========================================================================
  # 2. Compilación de Distribución Android (APK Oficial - Release Build)
  # =========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🐘 Compilar APK de OmniVault con Gradle (Release firmado con Keystore oficial)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ../build_release.log || {
            echo "### ❌ Gradle Release Build Error Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 ../build_release.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          mkdir -p ../dist/Releases
          TAG_VAL="${{ github.ref_name }}"
          if [ -z "$TAG_VAL" ] || [ "$TAG_VAL" = "refs/heads/main" ]; then
            TAG_VAL="${{ inputs.tag_name }}"
          fi
          if [ -z "$TAG_VAL" ]; then
            TAG_VAL="v2.2.0"
          fi
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_FILE" ../dist/Releases/AuraPlayer-${TAG_VAL}-Android.apk
          cp "$APK_FILE" ../dist/Releases/OmniVault-${TAG_VAL}-Android.apk

      - name: 📤 Subir artefacto de Android
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/Releases/*-Android.apk

  # =========================================================================
  # 3. Publicación Oficial en GitHub Releases
  # =========================================================================
  publish-release:
    name: Publish Official Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 📥 Descargar binarios de Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist/Releases

      - name: 📥 Descargar APK de Android
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/Releases

      - name: 🛡️ Calcular Sumas de Verificación SHA-256
        run: |
          cd dist/Releases
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 🔖 Resolver nombre de tag efectivo
        id: resolve_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: "✦ OmniVault ${{ steps.resolve_tag.outputs.tag }} — Windows PC & Android"
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            dist/Releases/OmniVault-*-Windows-x64-Setup.exe
            dist/Releases/OmniVault-*-Windows-x64-Portable.zip
            dist/Releases/*-Android.apk
            dist/Releases/SHA256SUMS.txt
          body: |
            ## ✦ OmniVault ${{ steps.resolve_tag.outputs.tag }} — Obsidian & Titanium Release

            > **Bóveda Multimedia Universal • Suite Creativa Multiplataforma para PC y Teléfonos Android**

            ---

            ### 📱 Nueva Versión para Teléfonos Android (Descargas en Segundo Plano & Keystore Oficial)
            - **⚡ Keystore Oficial Permanente:** Firma criptográfica fija para garantizar que todas las actualizaciones se instalen sin conflictos de paquetes.
            - **📥 Descarga 100% en Segundo Plano:** Servicio persistente con WakeLock, barra de progreso en vivo y velocidad en MB/s en la barra de notificaciones del celular.
            - **🔔 Notificación de Descarga Completada:** Con sonido, vibración y botones directos para Reproducir o Compartir.
            - **📋 Auto-Detección de Portapapeles (Snaptube-like):** Al copiar un enlace en cualquier navegador o aplicación, OmniVault te muestra un aviso flotante interactivo con botones de descarga directa (*MP3 320k* y *MP4 FHD*).

            ---

            ### 💻 Versiones Disponibles para PC (Windows)
            - **📦 Versión Portátil:** Totalmente autónoma en formato `.zip`. Solo descomprime y ejecuta `OmniVault.exe` en cualquier PC o memoria USB sin instalar nada.
            - **🛠️ Instalador Oficial:** Instalador clásico `.exe` generado con Inno Setup, con accesos directos en el Escritorio y Menú Inicio.
            - **⚡ Aceleración Aria2c:** Soporte multihilo de hasta 8 conexiones simultáneas.
            - **✂️ Recorte de Medios (Trim):** Extrae fragmentos exactos de video y audio con precisión de fotograma.
            - **🔊 Normalización EBU R128:** Calibración a -16 LUFS estándar de streaming musical.

            ---

            ### 📦 Paquetes Oficiales de Descarga

            | Plataforma | Paquete | Archivo | Descripción |
            | :--- | :--- | :--- | :--- |
            | 📱 **Android** | **APK Instalable** | `OmniVault-${{ steps.resolve_tag.outputs.tag }}-Android.apk` | Compatible con Android 8.0 a 14+. Firma oficial permanente con descargas en segundo plano. |
            | 💻 **Windows** | **Instalador Setup** | `OmniVault-${{ steps.resolve_tag.outputs.tag }}-Windows-x64-Setup.exe` | Instalación guiada clásica para Windows 10 y 11 (64 bits). |
            | 💻 **Windows** | **Versión Portátil** | `OmniVault-${{ steps.resolve_tag.outputs.tag }}-Windows-x64-Portable.zip` | No requiere instalación. Extraer y ejecutar. Ideal para memorias USB. |
            | 🛡️ **Seguridad** | **Sumas de Integridad** | `SHA256SUMS.txt` | Hashes criptográficos SHA-256 para validar la autenticidad de los archivos. |
