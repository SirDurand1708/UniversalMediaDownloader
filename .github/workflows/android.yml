name: 📱 Android Continuous Integration

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'

jobs:
  build:
    name: Build & Verify Android App
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🔨 Compilar APK con Gradle (Release firmado con Keystore oficial)
        run: |
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --stacktrace > ../gradle_full.log 2>&1
          GRADLE_EXIT=$?
          if [ $GRADLE_EXIT -ne 0 ]; then
            ERR_SNIPPET=$(grep -E "(FAILURE:|What went wrong:|Execution failed|Caused by:|e: )" -A 5 ../gradle_full.log | head -n 25 | tr '\n' ' | ')
            echo "::error title=Gradle Error::$ERR_SNIPPET"
            tail -n 50 ../gradle_full.log
            exit $GRADLE_EXIT
          fi
